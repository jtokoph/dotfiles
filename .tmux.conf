# ==============================================================================
# Tmux Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# General Settings
# ------------------------------------------------------------------------------

# Change prefix from Ctrl+b to Ctrl+a (more ergonomic, Screen-like)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support (pane selection, scrolling, resizing)
set -g mouse on

# Increase history limit (matches terminal scrollback preference)
set -g history-limit 10000

# Use 1-based indexing for windows and panes (easier keyboard access)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows sequentially when one is closed
set -g renumber-windows on

# Reduce escape time for better vim/neovim integration
set -sg escape-time 10

# Set terminal to support 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Enable focus events (for vim/neovim focus detection)
set -g focus-events on

# Increase repeat time for faster command repetition
set -g repeat-time 500

# Display pane numbers longer when using display-panes (in milliseconds)
set -g display-panes-time 2000

# ------------------------------------------------------------------------------
# Keybindings - Pane Management
# ------------------------------------------------------------------------------

# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes using vim-style keys
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes using Ctrl+h/j/k/l
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Toggle pane zoom (maximize/restore)
bind z resize-pane -Z

# Kill current pane
bind x kill-pane

# ------------------------------------------------------------------------------
# Keybindings - Window Management
# ------------------------------------------------------------------------------

# Create new window
bind c new-window -c "#{pane_current_path}"

# Navigate windows
bind -r n next-window
bind -r p previous-window

# Select window by number
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10

# Rename current window
bind , command-prompt -I "#W" "rename-window '%%'"

# Kill current window
bind & kill-window

# ------------------------------------------------------------------------------
# Keybindings - Session Management
# ------------------------------------------------------------------------------

# Detach from session
bind d detach

# List sessions (useful for switching)
bind s choose-session

# ------------------------------------------------------------------------------
# Keybindings - Copy Mode (Vi-style)
# ------------------------------------------------------------------------------

# Use vi keybindings in copy mode
setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode
bind ] paste-buffer

# Vi-style copy mode keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Copy to system clipboard (macOS)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Paste from system clipboard (macOS)
bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# ------------------------------------------------------------------------------
# Keybindings - Miscellaneous
# ------------------------------------------------------------------------------

# Reload configuration file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Clear screen
bind C-l send-keys C-l \; clear-history

# Choose window interactively
bind w choose-window

# Choose pane interactively (shows pane numbers, type number to select)
bind o display-panes

# ------------------------------------------------------------------------------
# Status Bar
# ------------------------------------------------------------------------------

# Status bar update interval
set -g status-interval 1

# Status bar position
set -g status-position bottom

# Status bar colors (brightened)
set -g status-style "bg=colour238 fg=colour220"

# Window status colors
setw -g window-status-style "fg=colour250"
setw -g window-status-current-style "fg=colour208 bold"

# Window status format
setw -g window-status-format "#[fg=colour250]#I:#W"
setw -g window-status-current-format "#[fg=colour208 bold]#I:#W"

# Status bar left side
set -g status-left-length 40
set -g status-left "#[fg=colour220,bold]#S #[fg=colour250]| "

# Status bar right side
set -g status-right-length 80
set -g status-right "#[fg=colour250]%Y-%m-%d %H:%M #[fg=colour220,bold]#h"

# Message style
set -g message-style "fg=colour232 bg=colour166 bold"

# ------------------------------------------------------------------------------
# Plugin Manager (TPM)
# ------------------------------------------------------------------------------

# TPM (Tmux Plugin Manager) - keep this line at the very bottom of your config file
# Install TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then run: ~/.tmux/plugins/tpm/bin/install_plugins
# Recommended plugins:
#   - tmux-resurrect: Save and restore tmux sessions
#   - tmux-continuum: Automatic session saving
#   - tmux-yank: Better clipboard integration
#   - tmux-open: Open highlighted selection in various apps

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
